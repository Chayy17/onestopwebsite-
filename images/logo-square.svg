    <rect x="26" y="56" width="27" height="21" rx="2" fill="#111111"/>
    <path d="M55 62 H65 L73 70 V77 H55 Z" fill="#111111"/>
    <path d="M58 65 H64 L68.5 69.5 H58 Z" fill="#FFFFFF"/>
